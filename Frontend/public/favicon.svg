
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" width="768" height="768">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001838"/>
      <stop offset="50%" stop-color="#002651"/>
      <stop offset="100%" stop-color="#033A70"/>
    </linearGradient>

    <!-- Peacock Arc Gradient 1 -->
    <linearGradient id="arc1Grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005CA4"/>
      <stop offset="50%" stop-color="#1292EE"/>
      <stop offset="100%" stop-color="#57B0FB"/>
    </linearGradient>

    <!-- Peacock Arc Gradient 2 -->
    <linearGradient id="arc2Grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#57B0FB"/>
      <stop offset="50%" stop-color="#1292EE"/>
      <stop offset="100%" stop-color="#00C2CB"/>
    </linearGradient>

    <!-- Skyline Gradient -->
    <linearGradient id="skylineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(87, 176, 251, 0.6)"/>
      <stop offset="50%" stop-color="rgba(18, 146, 238, 0.2)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="720" height="720" rx="190" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="720" height="720" rx="190" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Subtle grid texture in background -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="160" y1="120" x2="160" y2="648"/>
    <line x1="272" y1="120" x2="272" y2="648"/>
    <line x1="384" y1="120" x2="384" y2="648"/>
    <line x1="496" y1="120" x2="496" y2="648"/>
    <line x1="608" y1="120" x2="608" y2="648"/>
    <line x1="120" y1="200" x2="648" y2="200"/>
    <line x1="120" y1="312" x2="648" y2="312"/>
    <line x1="120" y1="424" x2="648" y2="424"/>
    <line x1="120" y1="536" x2="648" y2="536"/>
  </g>

  <!-- Outer Orbit Sync Ring - Upper Right Arc -->
  <path d="M 384,140
           A 244,244 0 0,1 628,384
           A 244,244 0 0,1 556,548
           L 516,512
           A 196,196 0 0,0 580,384
           A 196,196 0 0,0 384,188
           Z"
        fill="url(#arc1Grad)"/>
  
  <!-- Arrow Head 1 (Upper Right / Bottom) -->
  <polygon points="566,494 500,534 532,600" fill="#57B0FB"/>

  <!-- Outer Orbit Sync Ring - Lower Left Arc -->
  <path d="M 384,628
           A 244,244 0 0,1 140,384
           A 244,244 0 0,1 212,220
           L 252,256
           A 196,196 0 0,0 188,384
           A 196,196 0 0,0 384,580
           Z"
        fill="url(#arc2Grad)"/>

  <!-- Arrow Head 2 (Lower Left / Top) -->
  <polygon points="202,274 268,234 236,168" fill="#00C2CB"/>

  <!-- Central Modern Skyline Silhouette -->
  <!-- Tower 1 (Left) -->
  <rect x="264" y="360" width="60" height="180" rx="8" fill="url(#skylineGrad)"/>
  <rect x="278" y="380" width="12" height="16" rx="2" fill="#002651" opacity="0.65"/>
  <rect x="298" y="380" width="12" height="16" rx="2" fill="#002651" opacity="0.65"/>
  <rect x="278" y="412" width="12" height="16" rx="2" fill="#002651" opacity="0.65"/>
  <rect x="298" y="412" width="12" height="16" rx="2" fill="#002651" opacity="0.65"/>
  <rect x="278" y="444" width="12" height="16" rx="2" fill="#002651" opacity="0.65"/>
  <rect x="298" y="444" width="12" height="16" rx="2" fill="#002651" opacity="0.65"/>

  <!-- Tower 2 (Center Spire / Main) -->
  <rect x="348" y="270" width="72" height="270" rx="10" fill="url(#skylineGrad)"/>
  <!-- Spire Triangle -->
  <polygon points="384,212 354,270 414,270" fill="#FFFFFF"/>
  <!-- Windows -->
  <rect x="364" y="292" width="14" height="20" rx="3" fill="#002651" opacity="0.75"/>
  <rect x="390" y="292" width="14" height="20" rx="3" fill="#002651" opacity="0.75"/>
  <rect x="364" y="326" width="14" height="20" rx="3" fill="#002651" opacity="0.75"/>
  <rect x="390" y="326" width="14" height="20" rx="3" fill="#002651" opacity="0.75"/>
  <rect x="364" y="360" width="14" height="20" rx="3" fill="#002651" opacity="0.75"/>
  <rect x="390" y="360" width="14" height="20" rx="3" fill="#002651" opacity="0.75"/>
  <rect x="364" y="394" width="14" height="20" rx="3" fill="#002651" opacity="0.75"/>
  <rect x="390" y="394" width="14" height="20" rx="3" fill="#002651" opacity="0.75"/>

  <!-- Tower 3 (Right) -->
  <rect x="444" y="330" width="60" height="210" rx="8" fill="url(#skylineGrad)"/>
  <rect x="458" y="352" width="12" height="16" rx="2" fill="#002651" opacity="0.65"/>
  <rect x="478" y="352" width="12" height="16" rx="2" fill="#002651" opacity="0.65"/>
  <rect x="458" y="384" width="12" height="16" rx="2" fill="#002651" opacity="0.65"/>
  <rect x="478" y="384" width="12" height="16" rx="2" fill="#002651" opacity="0.65"/>
  <rect x="458" y="416" width="12" height="16" rx="2" fill="#002651" opacity="0.65"/>
  <rect x="478" y="416" width="12" height="16" rx="2" fill="#002651" opacity="0.65"/>

  <!-- Base Baseline -->
  <rect x="236" y="534" width="296" height="12" rx="6" fill="#57B0FB"/>

  <!-- Glowing Signal Pulse at Spire Peak -->
  <circle cx="384" cy="204" r="14" fill="#00E5FF" filter="url(#glow)"/>
  <circle cx="384" cy="204" r="8" fill="#FFFFFF"/>
</svg>
